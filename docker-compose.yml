version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    env_file:
      - .env
    volumes:
      - ./user_data:/app/user_data
      - ./logs:/app/user_data/logs
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge
